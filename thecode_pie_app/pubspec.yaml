name: thecode_pie_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  audioplayers: ^6.1.0
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/audio/

  fonts:
    - family: Cafe24Supermagic
      fonts:
        - asset: assets/fonts/Cafe24Supermagic-Regular-v1.0.ttf
          weight: 400
        - asset: assets/fonts/Cafe24Supermagic-Bold-v1.0.ttf
          weight: 700
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
